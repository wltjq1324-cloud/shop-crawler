name: daily-shop-crawl

# =============================================================================
# ★ 사이트별 수집 시각 처리
#   - cron 은 UTC 기준이라 KST 에서 9시간을 뺀 값으로 등록한다.
#   - targets.yaml 의 distinct schedule 마다 cron 을 하나씩 둔다.
#       09:00 KST -> 00:00 UTC
#       10:00 KST -> 01:00 UTC  (kakao_talkdeal_food 개별 조정 예시)
#   - 각 기동에서 크롤러가 "지금 due 인 타겟"만 실행한다.
#   - schedule 추가/변경 시: `python scripts/gen_cron.py` 로 cron 재생성.
# =============================================================================

on:
  schedule:
    - cron: '0 0 * * *'   # 09:00 KST
    - cron: '0 1 * * *'   # 10:00 KST
  # 즉시 수집 트리거: main 에 .recrawl 또는 크롤러/타겟 변경이 푸시되면
  # 전체 타겟을 그 자리에서 수집한다(스케줄과 무관, --all).
  push:
    branches: [main]
    paths:
      - '.recrawl'
      - 'crawler/**'
      - 'targets.yaml'
  workflow_dispatch:
    inputs:
      keys:
        description: '특정 타겟만 실행(콤마구분 key). 비우면 due 판정.'
        required: false
        default: ''
      all:
        description: 'schedule 무시하고 전체 실행'
        type: boolean
        required: false
        default: false

concurrency:
  group: shop-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run crawler
        run: |
          ARGS=""
          # 스케줄 기동: due 판정 / 그 외(push·수동): 전체 수집
          if [ "${{ github.event_name }}" != "schedule" ]; then ARGS="--all"; fi
          if [ "${{ github.event.inputs.all }}" = "true" ]; then ARGS="--all"; fi
          if [ -n "${{ github.event.inputs.keys }}" ]; then ARGS="--keys ${{ github.event.inputs.keys }}"; fi
          python -m crawler.main $ARGS

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-results-${{ github.run_id }}
          path: |
            data/shop.db
            exports/
            screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git add data/shop.db exports/ screenshots/ || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: crawl results $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi

      # ------ 크롤 직후 최신 데이터로 대시보드 빌드 → gh-pages 브랜치 배포 ------
      # gh-pages 브랜치 푸시는 GitHub Pages 를 자동 활성화/갱신한다.
      # (GITHUB_TOKEN 으로 Pages API 활성화가 불가해 브랜치 배포 방식을 쓴다)
      - name: Build & deploy dashboard to GitHub Pages
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site
          python dashboard/build_dashboard.py --out _site/index.html
          touch _site/.nojekyll
          cd _site
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: dashboard $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
