name: deploy-pages

# 대시보드만 다시 빌드해 gh-pages 브랜치로 배포한다 (GitHub Pages 자동 갱신).
# - main 에 대시보드/데이터 변경이 푸시되면 자동 배포
# - Actions 탭에서 수동 실행(workflow_dispatch)도 가능
# 크롤링 워크플로(crawl.yml)도 매 크롤 후 자체적으로 배포하므로,
# 이 워크플로는 코드/데이터 수동 변경 시의 보조 배포 경로다.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # build_dashboard.py 는 표준 라이브러리만 사용 — 의존성 설치 불필요
      - name: Build & deploy dashboard to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site
          python dashboard/build_dashboard.py --out _site/index.html
          touch _site/.nojekyll
          cd _site
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: dashboard $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
